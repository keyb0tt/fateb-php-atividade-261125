<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cascadia+Mono:ital,wght@0,200..700;1,200..700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Cascadia Mono", sans-serif;
      font-optical-sizing: auto;
    }

    .container {
      width: 100%;
      height: 100%;
      --color: rgba(114, 114, 114, 0.3);
      background-color: #191a1a;
      background-image: linear-gradient(0deg, transparent 24%, var(--color) 25%, var(--color) 26%, transparent 27%,transparent 74%, var(--color) 75%, var(--color) 76%, transparent 77%,transparent),
      linear-gradient(90deg, transparent 24%, var(--color) 25%, var(--color) 26%, transparent 27%,transparent 74%, var(--color) 75%, var(--color) 76%, transparent 77%,transparent);
      background-size: 55px 55px;
    }

    .title {
      text-align: center;
      font-size: 38px;
      font-weight: 1000;
      color: black;
      padding-top: 32px;
      padding-bottom: 12px;
    }

    .subtitle {
      text-align: center;
      font-size: 20px;
      color: black;
      padding-bottom: 24px;
    }

    .form-back {
      display:flex;
      background-image: radial-gradient(75% 75% at 50% 50%, #FFFFFFFF 0%, #DEDDDDFF 100%);
      margin-left: auto;
      margin-right: auto;
      border-radius: 30px;
      width: 450px;
      height: 500px;
    }


  </style>
  <title>Exercício 0</title>
</head>

<body>
  <div class="container">
    <p class="title">Exercício 0</p>
    <p class="subtitle">Lorem ipsum dolor sit </p>
    <div class="form-back">
    </div>
  </div>
</body>
</html>
